<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- fonte usada na página -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- biblioteca de ícones -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<title>TSEA - Login</title>

<style>

/* configurações gerais */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

/* fundo da página */
body{
    background:#f5f5f5;
}

/* cabeçalho */
.header{
    height:90px;
    background:linear-gradient(90deg,#c00000,#ff4d4d);
    display:flex;
    align-items:center;
    padding:0 30px;
    color:white;
}

/* nome da empresa */
.logo{
    font-size:28px;
    font-weight:700;
}

/* centraliza o conteúdo */
.container{
    height:calc(100vh - 90px);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* caixa de login */
.login-box{
    width:380px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* título login */
.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#000;
}

/* área dos inputs */
.input-box{
    position:relative;
    margin-bottom:18px;
}

/* campos de texto */
.input-box input{
    width:100%;
    padding:12px 40px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    color:#000;
}

/* ícones dos inputs */
.input-box i{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    color:#999;
}

/* botão entrar */
.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#c00000;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

/* efeito ao passar o mouse */
.btn:hover{
    background:#a00000;
}

</style>
</head>

<body>

<!-- cabeçalho da página -->
<header class="header">
    <div class="logo">TSEA</div>
</header>

<!-- área principal -->
<div class="container">

    <!-- caixa do login -->
    <div class="login-box">

        <h2>Login</h2>

        <!-- formulário -->
        <form id="loginForm">

            <!-- campo de email -->
            <div class="input-box">
                <i class='bx bxs-user'></i>
                <input
                    type="email"
                    id="email"
                    placeholder="Usuário ou E-mail"
                    required
                >
            </div>

            <!-- campo de senha -->
            <div class="input-box">
                <i class='bx bxs-lock-alt'></i>
                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required
                >
            </div>

            <!-- botão de login -->
            <button type="submit" class="btn">
                Entrar
            </button>

        </form>

    </div>

</div>

<script>

/* pega o formulário */
document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    /* impede o recarregamento da página */
    e.preventDefault();

    /* pega o email digitado */
    const email =
        document.getElementById("email").value;

    /* pega a senha digitada */
    const senha =
        document.getElementById("senha").value;

    try {

        /* envia os dados para a api */
        const resposta = await fetch(
            "http://localhost:5229/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    senha: senha
                })
            }
        );

        /* verifica se o login está correto */
        if(!resposta.ok){
            alert("Login inválido");
            return;
        }

        /* recebe os dados do usuário */
        const usuario = await resposta.json();

        console.log(usuario);

        /* salva o usuário */
        localStorage.setItem(
            "usuario",
            JSON.stringify(usuario)
        );

        /* mensagem de boas-vindas */
        alert("Bem-vindo, " + usuario.nome);

        /* redireciona conforme o perfil */
        if(usuario.perfil === "ADMIN"){

            window.location.href =
                "dashboard-admin.html";

        }else{

            window.location.href =
                "dashboard-operador.html";

        }

    }
    catch(erro){

        /* mostra erro no console */
        console.error(erro);

        /* mensagem de erro */
        alert("Erro ao conectar com a API");

    }

});

</script>

</body>
</html>
